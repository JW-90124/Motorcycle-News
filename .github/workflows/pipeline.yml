name: Collect, digest, and publish

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Singapore, Monday/Wednesday/Friday.
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch: {}
  # Rebuild the published site whenever digests/ content changes for any
  # other reason (e.g. a manual commit), not just on the scheduled run.
  push:
    branches: [main]
    paths: ["digests/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: motorcycle-news-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Collect new signals
        if: github.event_name != 'push'
        run: npm run collect

      - name: Generate digest
        if: github.event_name != 'push'
        run: npm run digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Commit collected data and digests
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ digests/
          git diff --staged --quiet || git commit -m "Automated collection $(date -u +%Y-%m-%d)"
          git push

      - name: Build public site
        run: npm run build-site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
