name: Collect and digest

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Singapore, Monday/Wednesday/Friday.
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: motorcycle-news-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run collect

      - run: npm run digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Commit collected data and digests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ digests/
          git diff --staged --quiet || git commit -m "Automated collection $(date -u +%Y-%m-%d)"
          git push
