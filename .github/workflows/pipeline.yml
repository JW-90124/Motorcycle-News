name: Collect, digest, and publish

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Singapore, Monday/Wednesday/Friday.
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch: {}
  # Rebuild+redeploy the published site whenever its content or the
  # generator itself changes for any reason other than the scheduled run
  # (e.g. a manual digests/ commit, or a src/build-site.ts edit).
  push:
    branches: [main]
    paths: ["digests/**", "src/build-site.ts"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: motorcycle-news-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Collect new signals
        if: github.event_name != 'push'
        run: npm run collect

      - name: Generate digest
        if: github.event_name != 'push'
        run: npm run digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # Runs after every Mon/Wed/Fri collection, not just Friday — it
      # regenerates the same week's file each time (named by that week's
      # Monday), so it reads as a "week so far" preview mid-week and the
      # complete top-10 after Friday's run, rather than showing nothing
      # until the week is over.
      - name: Generate weekly digest
        if: github.event_name != 'push'
        run: npm run weekly-digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Commit collected data and digests
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ digests/
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Automated collection $(date -u +%Y-%m-%d)"
          # main can move between checkout and here (a manual push landing
          # mid-run, or another triggered run) — retry with a rebase instead
          # of failing outright, the same recovery used manually this
          # session whenever that race was hit.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto origin/main and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Push still failing after 5 rebase attempts."
          exit 1

      - name: Build public site
        run: npm run build-site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
